name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # rust-toolchain.toml pins the exact toolchain; auto-install uses a
      # minimal profile, so add the fmt component explicitly.
      - run: rustup toolchain install && rustup component add rustfmt
      - run: cargo fmt --check
      # Issue #19: the pinned, checksum-verifying asset fetch step runs
      # in the Release workflow; keep its argument handling and quoting
      # under a shellcheck gate here.
      - name: Lint the packaging script (shellcheck)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          shellcheck scripts/fetch-assets

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins the exact toolchain; auto-install uses a
      # minimal profile, so add the clippy component explicitly.
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      # Linux needs GTK 3 development files to build the native window
      # shell (eframe/egui + rfd). macOS and Windows need nothing extra.
      - name: Install Linux GUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      # Issue #42 fail-closed guard: this job checks out only the
      # committed fixture bundle (placeholder Tesseract/Leptonica
      # bytes), and `cargo build --release` now REFUSES to compile
      # against placeholder assets. Build the debug profile here —
      # release-profile compile coverage moved to the e2e job below,
      # which fetches the real bundle first, and to the Release
      # workflow, which always runs against fetched assets.
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings

  # Issue #42 real-engine end-to-end job: fetch the real asset bundle
  # (build-time network only — the shipped binary stays offline at
  # runtime), build the RELEASE profile against real assets (this is
  # where release-profile compile coverage lives now), and convert the
  # committed fixtures through the PRODUCTION pipeline (bundled
  # PDFium + Tesseract via PipelineConverter::production(); no mocks,
  # no scratch/system fallback) with in-Rust lopdf assertions on the
  # output structure, the overlay text and its language.
  #
  # EXPECTED-RED until the real Tesseract/Leptonica pins land (tracked
  # in the sibling branch): scripts/fetch-assets still copies the
  # placeholder engine bytes for those slots today, so the build-time
  # guard fails this job on purpose. When the real pins merge, this
  # job turns green without any change here.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      # scripts/fetch-assets is a bash script (issue #19); a bash shell
      # keeps the Windows runner on Git Bash instead of PowerShell.
      - name: Fetch the real asset bundle (build-time network)
        shell: bash
        run: scripts/fetch-assets
      - name: Build the release profile against real assets
        run: cargo build --release --locked
      - name: Convert fixtures through the production pipeline
        run: cargo run --release --locked --example e2e_convert

  # Dependency gate for the offline promise (issue #20): adding a crate
  # with network capability must fail CI. bans + licenses need no
  # advisory database, so this job stays fast and network-light.
  # Advisories are deliberately NOT checked here (their DB lives in a
  # git repo fetched over the network) — see deny.toml and
  # docs/privacy-audit.md for the rationale and the local full-audit
  # procedure.
  deny:
    name: dependency gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install
      # Pinned binary release of cargo-deny (same version as verified
      # locally; see docs/privacy-audit.md).
      - name: Install cargo-deny 0.20.2 (pinned)
        run: |
          curl -sSfL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            | tar xz
          sudo install -m 755 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny /usr/local/bin/cargo-deny
          cargo deny --version
      # Feature-combo gate: tokio is allowed in the tree only without
      # its net feature (mio/socket2 bans already block linking it;
      # this check names the violation directly).
      - name: Fail if tokio's net feature is ever enabled
        run: |
          if cargo tree --target all -e features | grep -q 'tokio feature "net"'; then
            echo "::error::tokio's net feature is forbidden (runtime network access)"
            exit 1
          fi
      - run: cargo deny check bans licenses
