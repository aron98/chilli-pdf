[package]
name = "chilli-pdf"
version = "1.0.1"
edition = "2024"
rust-version = "1.96"
description = "Offline tool that turns scanned PDFs into searchable PDFs with selectable, copyable text"
readme = "README.md"
license = "MIT"
repository = "https://github.com/aron98/chilli-pdf"
keywords = ["pdf", "ocr", "tesseract", "pdfium", "searchable"]
categories = ["gui", "text-processing"]

# Dependencies land milestone by milestone (see the issue tracker and
# docs/architecture.md). `assets` needs: per-user directories (dirs),
# manifest hashing (sha2, hex), and embedding the asset bundle
# (include_dir).
[features]
default = ["gui"]
# Native window shell (eframe/egui + rfd dialogs). Off = headless build:
# the core logic compiles and tests without a display or GUI toolkit.
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
# Runtime dlopen of libtesseract: the OCR engine must load the native
# library by absolute path from the extracted assets, so no build-time
# linked tesseract crate is acceptable (see src/ocr/mod.rs).
libloading = "0.8"
dirs = "7"
hex = "0.4"
include_dir = "0.7"
sha2 = "0.11"
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }
# PDF rendering/saving backend. The native PDFium library is never linked at
# build time: pdfium-render loads it DYNAMICALLY at runtime from an absolute
# path resolved by `PdfiumLibrarySource` (the bundled-assets layer in
# production; a dev-downloaded binary under gitignored `scratch/` in dev).
pdfium-render = "0.9"
# Object-level PDF editing for the invisible-text overlay (issue #13).
# pdfium-render is a read/render API — it cannot add font objects or append
# content streams — so the overlay writer edits the original document with
# lopdf instead. Default features (chrono dates, rayon) are unused here.
lopdf = { version = "0.45", default-features = false }

[dev-dependencies]
# Decoding the committed PNG test fixture in integration tests.
png = "0.18"
# Exercising the PDF rendering backend in integration tests.
pdfium-render = "0.9"

# The build.rs placeholder guard (issue #42) hashes the OCR library slots
# with the same crates as the runtime verifier, so the guard and src/assets.rs
# can never disagree about what a placeholder is. Both crates are already
# runtime dependencies, so adding them here does not change Cargo.lock
# (the lock file does not record dependency kinds).
[build-dependencies]
sha2 = "0.11"
hex = "0.4"

[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"
