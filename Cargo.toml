[package]
name = "chilli-pdf"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Offline tool that turns scanned PDFs into searchable PDFs with selectable, copyable text"
readme = "README.md"
license = "MIT"
repository = "https://github.com/aron98/chilli-pdf"
keywords = ["pdf", "ocr", "tesseract", "pdfium", "searchable"]
categories = ["gui", "text-processing"]

[features]
default = ["gui"]
# Native window shell (eframe/egui + rfd dialogs). Off = headless build:
# the core logic compiles and tests without a display or GUI toolkit.
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[profile.release]
lto = "thin"
strip = "symbols"
panic = "abort"
